<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Back-to-school supplies</title>
  <desc id="desc">Colorful notebooks, pencils, rulers, and school supplies arranged on a deep blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3e91"/>
      <stop offset="0.58" stop-color="#08255f"/>
      <stop offset="1" stop-color="#071a44"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020817" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>

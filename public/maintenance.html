<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#e4e7eb" />
    <title>Site under maintenance</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #e4e7eb;
        color: #20242a;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 64px);
        background: radial-gradient(circle at 50% 42%, #f2f3f5 0, transparent 42%), #e4e7eb;
      }

      main {
        width: min(820px, 100%);
        min-height: min(564px, calc(100svh - 40px));
        display: grid;
        place-items: center;
        padding: clamp(48px, 8vw, 88px) clamp(24px, 7vw, 72px);
        text-align: center;
        background: #fff;
        border: 1px solid #d2d6db;
        border-radius: 17px;
        box-shadow: 0 14px 30px rgb(31 35 40 / 10%), 0 2px 7px rgb(31 35 40 / 8%);
      }

      section { width: min(100%, 520px); }
      svg { display: block; width: min(100%, 370px); height: auto; margin: 0 auto 34px; color: #6e747c; }
      h1 { margin: 0; color: #171a1f; font-size: clamp(1.35rem, 3vw, 1.65rem); line-height: 1.2; letter-spacing: -.025em; }
      p { margin: 15px auto 0; color: #626870; font-size: clamp(.86rem, 1.8vw, .95rem); line-height: 1.65; }

      @media (max-width: 560px) {
        body { padding: 16px; }
        main { min-height: calc(100svh - 32px); border-radius: 14px; }
        svg { margin-bottom: 28px; }
      }
    </style>
  </head>

</html>

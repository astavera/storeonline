<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#e4e7eb" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>Site under maintenance</title>

    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #e4e7eb;
        color: #20242a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 64px);
        background:
          radial-gradient(circle at 50% 42%, #f2f3f5 0, transparent 42%),
          #e4e7eb;
      }

      .maintenance-card {
        width: min(820px, 100%);
        min-height: min(564px, calc(100svh - 40px));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(48px, 8vw, 88px) clamp(24px, 7vw, 72px);
        overflow: hidden;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d2d6db;
        border-radius: 17px;
        box-shadow:
          0 14px 30px rgba(31, 35, 40, 0.1),
          0 2px 7px rgba(31, 35, 40, 0.08);
      }

      .maintenance-content {
        width: min(100%, 520px);
      }

      .maintenance-illustration {
        display: block;
        width: min(100%, 370px);
        height: auto;
        margin: 0 auto 34px;
        color: #6e747c;
      }

      h1 {
        margin: 0;
        color: #171a1f;
        font-size: clamp(1.35rem, 3vw, 1.65rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }

      p {
        margin: 15px auto 0;
        color: #626870;
        font-size: clamp(0.86rem, 1.8vw, 0.95rem);
        line-height: 1.65;
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        .maintenance-card {
          min-height: calc(100svh - 32px);
          border-radius: 14px;
        }

        .maintenance-illustration {
          margin-bottom: 28px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .maintenance-content {
          animation: appear 500ms ease-out both;
        }

        @keyframes appear {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>

  <body>
    <main class="maintenance-card" aria-labelledby="maintenance-title">
      <div class="maintenance-content">
        <svg
          class="maintenance-illustration"
          viewBox="0 0 520 245"
          role="img"
          aria-labelledby="illustration-title illustration-description"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title id="illustration-title">Website under construction</title>
          <desc id="illustration-description">
            Two construction cranes working around a website window.
          </desc>

          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 220H504" stroke-width="2" />

            <g fill="#eceef1" stroke="none">
              <path d="M42 220v-38h10v-28h15v48h16v-31h27v49z" />
              <path d="M411 220v-53h14v-28h13v-15l9-12 9 12v33h18v63z" />
              <path d="M378 220v-29h17v-36h13v65z" />
            </g>

            <g stroke-width="2">
              <path d="M112 220h45M121 219V72m27 147V72" />
              <path d="m121 89 27 20-27 20 27 20-27 20 27 20-27 20" />
              <path d="M102 72h64l-27-27-37 27Z" />
              <path d="M139 45v27M139 45l119 27H166" />
              <path d="M101 72h-17v10h19M149 72h19v11h-20" />
              <circle cx="139" cy="45" r="4" fill="#ffffff" />
              <path d="M114 220h41l-5-10h-31z" fill="#f4f5f6" />

              <path d="M388 220h42M396 219V107m26 112V107" />
              <path d="m396 123 26 18-26 18 26 18-26 18 26 18-21 15" />
              <path d="M375 107h69l-30-25-39 25Z" />
              <path d="M414 82v25M414 82l-68 25h29" />
              <path d="M375 107h-15v9h17M423 107h21v10h-20" />
              <circle cx="414" cy="82" r="4" fill="#ffffff" />
              <path d="M389 220h41l-5-10h-31z" fill="#f4f5f6" />
            </g>

            <g stroke-width="2.5">
              <rect x="180" y="95" width="165" height="126" rx="5" fill="#ffffff" />
              <path d="M180 114h165" />
              <circle cx="190" cy="104" r="1.6" fill="currentColor" stroke="none" />
              <circle cx="198" cy="104" r="1.6" fill="currentColor" stroke="none" />
              <circle cx="206" cy="104" r="1.6" fill="currentColor" stroke="none" />
            </g>

            <g stroke="none">
              <rect x="194" y="129" width="35" height="72" rx="2" fill="#a7acb3" />
              <rect x="242" y="168" width="31" height="20" rx="2" fill="#747a82" />
              <rect x="281" y="168" width="31" height="20" rx="2" fill="#8d9299" />
              <rect x="320" y="168" width="13" height="20" rx="2" fill="#b9bdc2" />
              <rect x="242" y="194" width="31" height="4" rx="2" fill="#b5b9bf" />
              <rect x="281" y="194" width="31" height="4" rx="2" fill="#b5b9bf" />
              <rect x="320" y="194" width="13" height="4" rx="2" fill="#b5b9bf" />
              <rect x="242" y="203" width="23" height="4" rx="2" fill="#d0d3d7" />
              <rect x="281" y="203" width="23" height="4" rx="2" fill="#d0d3d7" />
              <rect x="320" y="203" width="13" height="4" rx="2" fill="#d0d3d7" />
            </g>

            <g stroke-width="2">
              <path d="M258 72v27" />
              <path d="m252 95 6-15 7 15" fill="#ffffff" />
              <circle cx="258" cy="72" r="3" fill="#ffffff" />
              <path d="m229 124 10-33 101 30-10 33z" fill="#8e939a" />
            </g>
          </g>
        </svg>

        <h1 id="maintenance-title">Sorry! We Are Under Maintenance</h1>
        <p>
          Sorry for the inconvenience, but we&rsquo;re making a few improvements
          at the moment.<br />We&rsquo;ll be back online shortly.
        </p>
      </div>
    </main>
  </body>
</html>

name: storefront-canary

services:
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrations
    image: storefront/migrations:canary
    env_file:
      - ${STOREFRONT_ENV_FILE:-../../.env.storefront-private}
    environment:
      NODE_ENV: production
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"

  storefront:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-false}
        NEXT_PUBLIC_SQUARE_APPLICATION_ID: ${NEXT_PUBLIC_SQUARE_APPLICATION_ID:-}
        NEXT_PUBLIC_SQUARE_LOCATION_ID: ${NEXT_PUBLIC_SQUARE_LOCATION_ID:-}
    image: storefront/app:canary
    env_file:
      - ${STOREFRONT_ENV_FILE:-../../.env.storefront-private}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SITE_INDEXABLE: "false"
      SQUARE_CHECKOUT_ENABLED: "${SQUARE_CHECKOUT_ENABLED:-false}"
      ORDERPRO_LOCAL_DELIVERY_CHECKOUT_ENABLED: "${ORDERPRO_LOCAL_DELIVERY_CHECKOUT_ENABLED:-false}"
      ORDERPRO_SHIPPING_CHECKOUT_ENABLED: "${ORDERPRO_SHIPPING_CHECKOUT_ENABLED:-false}"
      ADMIN_DEV_BYPASS: "false"
      ALLOW_LOCAL_PERSISTENCE_FALLBACK: "false"
    expose:
      - "3000"
    networks:
      - database
      - gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /app/.next/cache:size=256m,mode=0750,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  database:
    external: true
    name: orderpro-production-database
  gateway:
    external: true
    name: orderpro-production-gateway

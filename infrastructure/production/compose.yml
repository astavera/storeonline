# Defines the production storefront, migration, worker, and PostgreSQL containers.

name: storefront-canary

services:
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrations
    image: "storefront/migrations:${STOREFRONT_IMAGE_TAG:?Set STOREFRONT_IMAGE_TAG to the immutable 40-character release commit}"
    env_file:
      - "${STOREFRONT_MIGRATOR_ENV_FILE:?Set STOREFRONT_MIGRATOR_ENV_FILE to the private migrator environment file}"
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    networks:
      database: {}

  storefront:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-false}
        NEXT_PUBLIC_SQUARE_APPLICATION_ID: ${NEXT_PUBLIC_SQUARE_APPLICATION_ID:-}
        NEXT_PUBLIC_SQUARE_LOCATION_ID: ${NEXT_PUBLIC_SQUARE_LOCATION_ID:-}
    image: "storefront/app:${STOREFRONT_IMAGE_TAG:?Set STOREFRONT_IMAGE_TAG to the immutable 40-character release commit}"
    env_file:
      - "${STOREFRONT_RUNTIME_ENV_FILE:?Set STOREFRONT_RUNTIME_ENV_FILE to the private runtime environment file}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SITE_INDEXABLE: "false"
      STOREFRONT_DESIGN_PREVIEW: "false"
      STOREFRONT_ADMIN_PREVIEW: "${STOREFRONT_ADMIN_PREVIEW:?Set STOREFRONT_ADMIN_PREVIEW to true or false}"
      E2E_CATALOG_FIXTURE: "false"
      SQUARE_CHECKOUT_ENABLED: "${SQUARE_CHECKOUT_ENABLED:-false}"
      ORDERPRO_LOCAL_DELIVERY_CHECKOUT_ENABLED: "${ORDERPRO_LOCAL_DELIVERY_CHECKOUT_ENABLED:-false}"
      ORDERPRO_SHIPPING_CHECKOUT_ENABLED: "${ORDERPRO_SHIPPING_CHECKOUT_ENABLED:-false}"
      ADMIN_DEV_BYPASS: "false"
      ALLOW_LOCAL_PERSISTENCE_FALLBACK: "false"
    expose:
      - "3000"
    networks:
      database: {}
      orderpro-private: {}
      gateway:
        aliases:
          - storefront
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /app/.next/cache:size=256m,mode=0750,noexec,nosuid
    volumes:
      - admin-media:/app/public/uploads/admin
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  database:
    external: true
    name: ${STOREFRONT_DATABASE_NETWORK:-storefront-production-database}
  orderpro-private:
    external: true
    name: ${STOREFRONT_ORDERPRO_NETWORK:-storefront-orderpro-private}
  gateway:
    external: true
    name: ${STOREFRONT_GATEWAY_NETWORK:-storefront-public-gateway}

volumes:
  admin-media:
    name: storefront-admin-media

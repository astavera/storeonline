# Validates linting, types, tests, builds, and database compatibility in continuous integration.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality / static and unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci

      - name: Audit production dependencies
        run: npm run audit:prod

  postgres-integration:
    name: Integration / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storeonline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/storeonline_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/storeonline_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/storeonline_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations to disposable PostgreSQL
        run: npm run prisma:migrate:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:integration:postgres

  build:
    name: Quality / production build
    needs:
      - quality
      - postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci

      - name: Build production application
        run: npm run build

  e2e:
    name: Quality / browser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/storeonline_ci

      - name: Build application for browser tests
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            .playwright-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
